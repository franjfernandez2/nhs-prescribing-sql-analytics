    <text x="28" y="82" fill="#8be9fd">$ psql ... -f sql/01_basic/01_top_chemicals_by_cost.sql</text><text x="28" y="106" fill="#f8f8f2"></text><text x="28" y="130" fill="#50fa7b">Top BNF chemical substances by actual cost</text><text x="28" y="154" fill="#f8f8f2">1. Tirzepatide                                      £67,204,353.65    292,949 items</text><text x="28" y="178" fill="#f8f8f2">2. Detection Sensor Interstitial Fluid/Gluc         £31,772,196.60    388,264 items</text><text x="28" y="202" fill="#f8f8f2">3. BeclometDiprop/Formoterol                        £24,413,904.52    803,643 items</text><text x="28" y="226" fill="#f8f8f2"></text><text x="28" y="250" fill="#8be9fd">$ psql ... -f sql/01_basic/02_top_presentations_by_cost.sql</text><text x="28" y="274" fill="#f8f8f2"></text><text x="28" y="298" fill="#50fa7b">Top BNF presentations by actual cost</text><text x="28" y="322" fill="#f8f8f2">1. FreeStyle Libre 2 Plus Sensor                    £29,139,717.47    avg £82.47/item</text><text x="28" y="346" fill="#f8f8f2">2. Mounjaro KwikPen 5mg/0.6ml                       £18,287,626.53    avg £192.57/item</text><text x="28" y="370" fill="#f8f8f2">3. Mounjaro KwikPen 7.5mg/0.6ml                     £10,640,347.60    avg £268.78/item</text><text x="28" y="394" fill="#f8f8f2"></text><text x="28" y="418" fill="#8be9fd">$ psql ... -f sql/01_basic/03_top_icbs_by_cost.sql</text><text x="28" y="442" fill="#f8f8f2"></text><text x="28" y="466" fill="#50fa7b">Top ICBs by actual cost</text><text x="28" y="490" fill="#f8f8f2">1. NHS North East and North Cumbria ICB             £55,005,847.78</text><text x="28" y="514" fill="#f8f8f2">2. NHS Greater Manchester ICB                       £50,274,220.52</text><text x="28" y="538" fill="#f8f8f2">3. NHS Cheshire and Merseyside ICB                  £47,295,566.01</text>
